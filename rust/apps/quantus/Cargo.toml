[package]
name = "app_quantus"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true, default-features = false }
# keystore = { workspace = true }
thiserror = { workspace = true }
app_utils = { workspace = true }
rust_tools = { workspace = true }
cryptoxide = { workspace = true }
bitcoin = { workspace = true }
qp-rusty-crystals-dilithium = { version = "2.5.0", default-features = false }
qp-rusty-crystals-hdwallet = { version = "2.4.0", default-features = false }
qp-poseidon-core = { version = "2.1.0", default-features = false }
quantus_ur = { git = "https://github.com/Quantus-Network/quantus_ur.git", tag = "1.4.0", default-features = false }

zeroize = { workspace = true }
parity-scale-codec = { workspace = true }
base58 = { version = "0.2", default-features = false }
blake2 = { version = "0.10", default-features = false }

parity-scale-codec-derive = { workspace = true }
ur-registry = { workspace = true }
ur-parse-lib = { workspace = true }
minicbor = { workspace = true }
spin = { version = "0.9", default-features = false, features = ["spin_mutex"] }

[features]
# Opt-in ONLY for local debugging: logs derived secrets (mnemonic/passphrase) via
# rust_tools::debug. OFF by default so secrets are never printed on device or simulator
# builds. Never enable in a release/production build.
debug_secrets = []

[dev-dependencies]
keystore = { path = "../../keystore" }
# Chain-side conformance testing (host-only):
# - frame-metadata/scale-info decode the checked-in live Planck runtime metadata so the
#   parser's mirrored call/extension codecs are asserted against what the chain publishes.
# - qp-dilithium-crypto is the chain's own signature scheme crate; it verifies
#   device-produced signatures through the exact Verify impl the runtime uses.
frame-metadata = { version = "23", default-features = false, features = ["current", "decode", "std"] }
scale-info = { version = "2", default-features = false, features = ["std"] }
qp-dilithium-crypto = { version = "0.4.0", features = ["std"] }
sp-core = { version = "39", default-features = false, features = ["std"] }
sp-runtime = { version = "45", default-features = false, features = ["std"] }
